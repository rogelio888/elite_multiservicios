# ==============================================================================
# Elite Multiservicios - Infrastructure as Code (Render Blueprint)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend: Serverpod Monolith (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: elite-backend
    runtime: docker
    repo: https://github.com/rogelio888/elite_multiservicios
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./elite_multiservicios_server/Dockerfile
    dockerContext: ./elite_multiservicios_server
    healthCheckPath: /livez
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVERPOD_MODE
        value: production
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SERVERPOD_PASSWORD_database
        sync: false
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: elite-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: elite-redis
          property: port
      - key: SERVERPOD_PASSWORD_redis
        fromService:
          type: keyvalue
          name: elite-redis
          property: connectionString
      - key: SERVERPOD_PASSWORD_emailSecretHashPepper
        generateValue: true
      - key: SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey
        generateValue: true
      - key: SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev
      - key: SMTP_FROM_NAME
        value: Elite Multiservicios
      - key: SEED_ADMIN_EMAIL
        value: rogeliovladimir2016@gmail.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_MFA_ENABLED
        value: "false"
      - key: SEED_ON_START
        value: "true"

  # ----------------------------------------------------------------------------
  # Frontend: Flutter Web (Docker + Nginx SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: elite-frontend
    runtime: docker
    repo: https://github.com/rogelio888/elite_multiservicios
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./elite_multiservicios_flutter/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SERVER_URL
        sync: false

  # ----------------------------------------------------------------------------
  # Cache & PubSub: Key Value (Redis)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: elite-redis
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
