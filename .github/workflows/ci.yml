name: Enterprise CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secrets-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  code-quality:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Workspace Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Serverpod Backend
        working-directory: elite_multiservicios_server
        run: dart analyze

      - name: Analyze Flutter Frontend
        working-directory: elite_multiservicios_flutter
        run: flutter analyze

  flutter-tests:
    name: Flutter Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Workspace Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: elite_multiservicios_flutter
        run: flutter test

  server-tests:
    name: Serverpod Tests & Database Integration
    runs-on: ubuntu-latest
    env:
      SERVERPOD_PASSWORD_database: 'ci-dummy-not-real'
      SERVERPOD_PASSWORD_redis: 'ci-dummy-not-real'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create CI .env with dummy credentials
        working-directory: elite_multiservicios_server
        shell: bash
        run: |
          cat > ../.env << 'EOF'
          POSTGRES_DEV_PASSWORD=ci-dummy-not-real
          REDIS_DEV_PASSWORD=ci-dummy-not-real
          POSTGRES_TEST_PASSWORD=ci-dummy-not-real
          REDIS_TEST_PASSWORD=ci-dummy-not-real
          EOF

      - name: Start PostgreSQL & Redis Containers
        working-directory: elite_multiservicios_server
        run: docker compose up --quiet-pull --build -d

      - name: Wait for PostgreSQL and Redis to be ready
        working-directory: elite_multiservicios_server
        shell: bash
        run: |
          echo "Waiting for PostgreSQL (port 9090)..."
          for i in {1..30}; do
            if docker compose exec -T postgres_test pg_isready -U postgres >/dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ PostgreSQL did not become ready in 60 seconds"
              docker compose logs postgres_test
              exit 1
            fi
            echo "Attempt $i/30: not ready, waiting 2s..."
            sleep 2
          done

          echo "Waiting for Redis (port 9091)..."
          for i in {1..30}; do
            if docker compose exec -T redis_test redis-cli -a ci-dummy-not-real ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Redis did not become ready in 60 seconds"
              docker compose logs redis_test
              exit 1
            fi
            echo "Attempt $i/30: not ready, waiting 2s..."
            sleep 2
          done

          echo "All containers are ready. Proceeding with tests."

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Server Tests
        working-directory: elite_multiservicios_server
        run: dart test

      - name: Tear Down Containers
        if: always()
        working-directory: elite_multiservicios_server
        run: docker compose down -v
