### Partida individual de cotización o presupuesto de un contrato.
class: CrmContractBudgetItem
table: crm_contract_budget_item
fields:
  ### ID del contrato al que pertenece la partida.
  contractId: int, relation(parent=crm_customer_contract, onDelete=Cascade)
  ### ID referencial de la partida en el catálogo maestro (service_id).
  catalogItemId: int?
  ### Descripción detallada del ítem o servicio.
  description: String
  ### Cantidad requerida.
  quantity: double
  ### Unidad de medida (Mes, Puesto, Global, Horas, m², Unidad, Visita).
  unit: String
  ### Precio unitario en Bs.
  unitPrice: double
  ### Eliminación lógica y auditoría temporal.
  isDeleted: bool, default=false
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  crm_contract_budget_item_contract_idx:
    fields: contractId
  crm_contract_budget_item_catalog_item_idx:
    fields: catalogItemId
