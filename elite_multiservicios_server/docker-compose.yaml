# ==============================================================================
# ELITE MULTISERVICIOS - DOCKER COMPOSE LOCAL Y TEST
# ==============================================================================
# Las contraseñas se cargan directamente desde el archivo `.env` en la raíz.
# NUNCA ingresar contraseñas reales directamente en este archivo.
# ==============================================================================

services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ../.env
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: elite_multiservicios
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD}
    volumes:
      - elite_multiservicios_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    env_file:
      - ../.env
    ports:
      - "8091:6379"
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    env_file:
      - ../.env
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: elite_multiservicios_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    volumes:
      - elite_multiservicios_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    env_file:
      - ../.env
    ports:
      - "9091:6379"
    command: redis-server --requirepass "${REDIS_TEST_PASSWORD}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  elite_multiservicios_data:
  elite_multiservicios_test_data:
